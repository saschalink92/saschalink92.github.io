name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      # REMOVED: The manual "npm install" step. 
      # The Astro action below handles installation automatically.

      - name: Install, build, and upload your site output
        uses: withastro/action@v2
        with:
            # Ensure you have a pnpm-lock.yaml file in your repo
            # if you want to enforce pnpm
            package-manager: pnpm@9.12.2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
